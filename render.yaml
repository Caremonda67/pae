# Configuracion para desplegar el backend y el frontend en Render
# Render lee este archivo al importar el repositorio
# (New Web Service -> conectar GitHub -> elegir el repo "pae")

services:
  - type: web
    name: pae-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    envVars:
      - key: PORT
        value: 4000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  - type: static
    name: pae-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://pae-api.onrender.com
    routes:
      - type: rewrite
        source: /**
        destination: /index.html
