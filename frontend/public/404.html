<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAE</title>
    <!-- Este archivo sirve para que las rutas internas de la app
         (ej: /admin) no den error 404 al recargar en GitHub Pages.
         Redirige a la raiz y la app se encarga de mostrar la pagina. -->
    <script>
      const segmento = location.pathname.replace(/^\/pae/, "");
      location.replace("/pae" + "#" + segmento);
    </script>
  </head>
  <body>
    <a href="/pae/">Ir a la pagina principal</a>
  </body>
</html>
