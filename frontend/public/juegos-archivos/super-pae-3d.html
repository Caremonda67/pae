<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super PAE Recicla 3D</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      width: 100vw;
      height: 100vh;
    }

    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 10;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 18px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    #targetDisplay {
      font-size: 20px;
      color: #FFEB3B;
      border-color: #FFEB3B;
    }

    #instructions {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    #game-over {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.85);
      color: #fff;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    #game-over h1 { font-size: 48px; color: #ff4444; margin-bottom: 10px; }
    #game-over button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
  <!-- Importar Three.js desde CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud">
    <div class="hud-box" id="scoreDisplay">Puntos: 0</div>
    <div class="hud-box" id="targetDisplay">Misión PAE: Caneca Blanca (Plásticos/Tetra)</div>
    <div class="hud-box" id="livesDisplay">Vidas: ❤️❤️❤️</div>
  </div>

  <div id="instructions">
    <b>Controles:</b> W, A, S, D / Flechas para Mover | Espacio para Saltar | Evita al Enemigo Monstruo de Basura 👿
  </div>

  <div id="game-over">
    <h1>¡JUEGO TERMINADO!</h1>
    <p id="finalScore">Puntaje Final: 0</p>
    <button onclick="location.reload()">Jugar de Nuevo</button>
  </div>

  <script>
    // --- CONFIGURACIÓN E INICIALIZACIÓN DE THREE.JS ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x60c3ff); // Cielo estilo Mario
    scene.fog = new THREE.Fog(0x60c3ff, 20, 60);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(20, 40, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 100;
    const d = 25;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // --- VARIABLES DEL JUEGO ---
    let score = 0;
    let lives = 3;
    let gameActive = true;

    const BINS = [
      { type: 'organico', name: 'Caneca Verde (Orgánicos PAE)', color: '#2e7d32' },
      { type: 'reciclable', name: 'Caneca Blanca (Plásticos/Tetra PAE)', color: '#ffffff' },
      { type: 'no_aprovechable', name: 'Caneca Negra (Servilletas/Servidas)', color: '#212121' }
    ];
    let currentBinIndex = 1;
    let currentTarget = BINS[currentBinIndex];

    // --- ESCENARIO (PLATAFORMAS) ---
    const platforms = [];
    const platformMaterials = {
      grass: new THREE.MeshStandardMaterial({ color: 0x4caf50 }),
      dirt: new THREE.MeshStandardMaterial({ color: 0x795548 })
    };

    function createPlatform(x, y, z, width, height, depth) {
      const group = new THREE.Group();

      // Capa de pasto
      const grassGeo = new THREE.BoxGeometry(width, 0.4, depth);
      const grassMesh = new THREE.Mesh(grassGeo, platformMaterials.grass);
      grassMesh.position.y = height / 2;
      grassMesh.receiveShadow = true;
      grassMesh.castShadow = true;
      group.add(grassMesh);

      // Bloque de tierra
      const dirtGeo = new THREE.BoxGeometry(width, height - 0.4, depth);
      const dirtMesh = new THREE.Mesh(dirtGeo, platformMaterials.dirt);
      dirtMesh.position.y = 0;
      dirtMesh.receiveShadow = true;
      dirtMesh.castShadow = true;
      group.add(dirtMesh);

      group.position.set(x, y, z);
      scene.add(group);

      const boundingBox = new THREE.Box3().setFromObject(group);
      platforms.push({ mesh: group, box: boundingBox, yTop: y + height / 2 + 0.2 });
      return group;
    }

    // Generar Mapa de Plataformas Estilo Mario
    createPlatform(0, 0, 0, 16, 2, 16);        // Plataforma Principal
    createPlatform(-12, 3, -4, 8, 2, 8);      // Izquierda baja
    createPlatform(12, 3, -4, 8, 2, 8);       // Derecha baja
    createPlatform(0, 6, -12, 10, 2, 8);      // Centro alta
    createPlatform(0, 10, -22, 12, 2, 10);    // Plataforma Superior Final

    // --- JUGADOR (JUGADOR MARIO 3D) ---
    const playerGroup = new THREE.Group();

    // Cuerpo
    const bodyGeo = new THREE.BoxGeometry(1, 1.2, 0.8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe53935 }); // Camiseta Roja
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyMesh.castShadow = true;
    bodyMesh.position.y = 0.6;
    playerGroup.add(bodyMesh);

    // Cabeza
    const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc80 });
    const headMesh = new THREE.Mesh(headGeo, headMat);
    headMesh.position.y = 1.6;
    headMesh.castShadow = true;
    playerGroup.add(headMesh);

    // Gorra
    const hatGeo = new THREE.BoxGeometry(0.9, 0.3, 1.1);
    const hatMat = new THREE.MeshStandardMaterial({ color: 0xd32f2f });
    const hatMesh = new THREE.Mesh(hatGeo, hatMat);
    hatMesh.position.set(0, 2.0, -0.1);
    hatMesh.castShadow = true;
    playerGroup.add(hatMesh);

    playerGroup.position.set(0, 2, 0);
    scene.add(playerGroup);

    // Físicas del Jugador
    const player = {
      velocity: new THREE.Vector3(),
      speed: 0.18,
      jumpForce: 0.35,
      grounded: false,
      radius: 0.6
    };

    // --- ENEMIGO (MONSTRUO DE BASURA NO RECICLABLE) ---
    const enemyGroup = new THREE.Group();
    const enemyBodyGeo = new THREE.DodecahedronGeometry(0.9);
    const enemyMat = new THREE.MeshStandardMaterial({ color: 0x424242, roughness: 0.9 });
    const enemyMesh = new THREE.Mesh(enemyBodyGeo, enemyMat);
    enemyMesh.castShadow = true;
    enemyGroup.add(enemyMesh);

    // Ojos Rojos
    const eyeGeo = new THREE.SphereGeometry(0.15, 8, 8);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
    eye1.position.set(-0.3, 0.3, 0.7);
    const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
    eye2.position.set(0.3, 0.3, 0.7);
    enemyGroup.add(eye1, eye2);

    enemyGroup.position.set(-3, 7.5, -12);
    scene.add(enemyGroup);

    let enemyDirection = 1;
    const enemySpeed = 0.08;

    // --- GENERACIÓN DE RESIDUOS 3D ---
    const items = [];
    const itemTypes = [
      { type: 'organico', color: 0xff3d00, shape: 'apple' },       // Manzana PAE
      { type: 'reciclable', color: 0x29b6f6, shape: 'box' },        // Caja Leche PAE
      { type: 'no_aprovechable', color: 0x757575, shape: 'sphere' } // Envoltura Sucia
    ];

    function createWasteItem(x, y, z, itemData) {
      const group = new THREE.Group();
      let mesh;

      if (itemData.shape === 'apple') {
        const geo = new THREE.SphereGeometry(0.4, 12, 12);
        const mat = new THREE.MeshStandardMaterial({ color: itemData.color });
        mesh = new THREE.Mesh(geo, mat);
      } else if (itemData.shape === 'box') {
        const geo = new THREE.BoxGeometry(0.6, 0.8, 0.4);
        const mat = new THREE.MeshStandardMaterial({ color: itemData.color });
        mesh = new THREE.Mesh(geo, mat);
      } else {
        const geo = new THREE.DodecahedronGeometry(0.4);
        const mat = new THREE.MeshStandardMaterial({ color: itemData.color });
        mesh = new THREE.Mesh(geo, mat);
      }

      mesh.castShadow = true;
      group.add(mesh);
      group.position.set(x, y, z);
      scene.add(group);

      items.push({ group, type: itemData.type, baseY: y });
    }

    function spawnAllItems() {
      // Limpiar anteriores
      items.forEach(i => scene.remove(i.group));
      items.length = 0;

      // Colocar residuos en las plataformas
      createWasteItem(-4, 2, 2, itemTypes[0]);
      createWasteItem(4, 2, -2, itemTypes[1]);
      createWasteItem(-12, 5, -4, itemTypes[1]);
      createWasteItem(12, 5, -4, itemTypes[2]);
      createWasteItem(3, 8, -12, itemTypes[0]);
      createWasteItem(0, 12, -22, itemTypes[1]);
    }

    spawnAllItems();

    // --- ROTACIÓN DE MISIÓN / CANECA ---
    setInterval(() => {
      currentBinIndex = (currentBinIndex + 1) % BINS.length;
      currentTarget = BINS[currentBinIndex];
      const targetHud = document.getElementById('targetDisplay');
      targetHud.innerText = `Misión PAE: ${currentTarget.name}`;
      targetHud.style.borderColor = currentTarget.color === '#ffffff' ? '#fff' : currentTarget.color;
    }, 9000);

    // --- CONTROLES DE TECLADO ---
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // --- BUCLE PRINCIPAL Y FÍSICAS ---
    const gravity = 0.015;

    function update() {
      if (!gameActive) return;

      // Movimiento Lateral / Profundidad
      let moveX = 0;
      let moveZ = 0;

      if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

      if (moveX !== 0 || moveZ !== 0) {
        const moveVec = new THREE.Vector2(moveX, moveZ).normalize().multiplyScalar(player.speed);
        playerGroup.position.x += moveVec.x;
        playerGroup.position.z += moveVec.y;

        // Orientar personaje en la dirección del movimiento
        const angle = Math.atan2(moveVec.x, moveVec.y);
        playerGroup.rotation.y = angle;
      }

      // Salto
      if ((keys['Space']) && player.grounded) {
        player.velocity.y = player.jumpForce;
        player.grounded = false;
      }

      // Aplicar Gravedad
      player.velocity.y -= gravity;
      playerGroup.position.y += player.velocity.y;

      // Colisión con Plataformas
      player.grounded = false;
      platforms.forEach(plat => {
        const px = playerGroup.position.x;
        const py = playerGroup.position.y;
        const pz = playerGroup.position.z;

        const bounds = plat.box;
        if (
          px >= bounds.min.x - 0.3 && px <= bounds.max.x + 0.3 &&
          pz >= bounds.min.z - 0.3 && pz <= bounds.max.z + 0.3 &&
          py <= plat.yTop && py >= plat.yTop - 0.8 &&
          player.velocity.y <= 0
        ) {
          playerGroup.position.y = plat.yTop;
          player.velocity.y = 0;
          player.grounded = true;
        }
      });

      // Caída al vacío (Derrota)
      if (playerGroup.position.y < -10) {
        takeDamage(true);
      }

      // --- MOVIMIENTO Y COLISIÓN DEL ENEMIGO ---
      enemyGroup.position.x += enemyDirection * enemySpeed;
      enemyGroup.rotation.y += 0.05;
      if (enemyGroup.position.x > 3.5 || enemyGroup.position.x < -3.5) {
        enemyDirection *= -1;
      }

      // Distancia Jugador - Enemigo
      const distEnemy = playerGroup.position.distanceTo(enemyGroup.position);
      if (distEnemy < 1.3) {
        takeDamage(false);
      }

      // --- RECOLECCIÓN DE RESIDUOS ---
      items.forEach((item, index) => {
        item.group.rotation.y += 0.03;
        item.group.position.y = item.baseY + Math.sin(Date.now() * 0.005 + index) * 0.2;

        const dist = playerGroup.position.distanceTo(item.group.position);
        if (dist < 1.2) {
          if (item.type === currentTarget.type) {
            score += 15;
          } else {
            lives--;
          }
          updateHUD();
          scene.remove(item.group);
          items.splice(index, 1);

          if (items.length === 0) {
            spawnAllItems();
          }

          if (lives <= 0) gameOver();
        }
      });

      // --- CÁMARA SEGUIDORA (ESTILO MARIO 64) ---
      camera.position.x = playerGroup.position.x;
      camera.position.y = playerGroup.position.y + 6;
      camera.position.z = playerGroup.position.z + 12;
      camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);
    }

    function takeDamage(resetPos = false) {
      lives--;
      updateHUD();
      if (resetPos || lives > 0) {
        playerGroup.position.set(0, 3, 0);
        player.velocity.set(0, 0, 0);
      }
      if (lives <= 0) {
        gameOver();
      }
    }

    function updateHUD() {
      document.getElementById('scoreDisplay').innerText = `Puntos: ${score}`;
      document.getElementById('livesDisplay').innerText = `Vidas: ${'❤️'.repeat(Math.max(0, lives))}`;
    }

    function gameOver() {
      gameActive = false;
      document.getElementById('finalScore').innerText = `Puntaje Final: ${score}`;
      document.getElementById('game-over').style.display = 'flex';
    }

    function render() {
      update();
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }

    // Ajuste de Ventana
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    render();
  </script>
</body>
</html>
