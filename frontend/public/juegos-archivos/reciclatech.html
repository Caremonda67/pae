<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReciclaTech ♻️</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f0f0f0;
            text-align: center;
            margin: 0;
            padding: 8px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        h1 {
            margin: 4px 0;
            font-size: 1.2rem;
        }
        p {
            margin: 4px 0;
            font-size: 0.85rem;
        }
        #game-container {
            width: 100%;
            max-width: 520px;
            height: min(55vh, 320px);
            background-color: #1e293b;
            margin: 8px auto;
            position: relative;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            overflow: hidden;
        }
        .item {
            font-size: 40px;
            position: absolute;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
        .item:active {
            transform: scale(0.8);
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .stats {
            font-size: 20px;
            margin: 10px;
        }
    </style>
</head>
<body>

    <h1>ReciclaTech ♻️💻</h1>
    <p>Haz clic en la <strong>basura electrónica</strong> para reciclarla.<br>¡Pero no toques la basura orgánica o el cartón!</p>
    
    <div class="stats">
        Puntos: <span id="score">0</span> | Tiempo: <span id="time">30</span>s
    </div>
    
    <button id="start-btn">Jugar</button>

    <div id="game-container"></div>

    <script>
        const eWaste = ['📱', '🔋', '💻', '🖱️', '📺', '⌚'];
        const otherWaste = ['🍎', '🗞️', '🍌', '📦', '👕', '🦴'];
        
        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let spawnInterval;
        
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startBtn = document.getElementById('start-btn');
        const gameContainer = document.getElementById('game-container');

        startBtn.addEventListener('click', startGame);

        function startGame() {
            score = 0;
            timeLeft = 30;
            scoreEl.innerText = score;
            timeEl.innerText = timeLeft;
            gameContainer.innerHTML = '';
            startBtn.style.display = 'none';

            gameInterval = setInterval(updateTime, 1000);
            spawnInterval = setInterval(spawnItem, 800);
        }

        function updateTime() {
            timeLeft--;
            timeEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }

        function spawnItem() {
            const itemEl = document.createElement('div');
            itemEl.classList.add('item');
            
            // Decidir si es basura electrónica o no (60% probabilidad de que sea tech)
            const isTech = Math.random() > 0.4;
            const itemsArray = isTech ? eWaste : otherWaste;
            const randomItem = itemsArray[Math.floor(Math.random() * itemsArray.length)];
            
            itemEl.innerText = randomItem;
            itemEl.dataset.type = isTech ? 'tech' : 'other';

            // Posición aleatoria dentro del contenedor
            const maxX = gameContainer.clientWidth - 50;
            const maxY = gameContainer.clientHeight - 50;
            itemEl.style.left = Math.floor(Math.random() * maxX) + 'px';
            itemEl.style.top = Math.floor(Math.random() * maxY) + 'px';

            itemEl.addEventListener('mousedown', () => collectItem(itemEl));

            gameContainer.appendChild(itemEl);

            // Desaparecer después de un tiempo
            setTimeout(() => {
                if (gameContainer.contains(itemEl)) {
                    itemEl.remove();
                }
            }, 1500);
        }

        function collectItem(element) {
            if (element.dataset.type === 'tech') {
                score += 10;
            } else {
                score -= 5;
            }
            scoreEl.innerText = score;
            element.remove();
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            gameContainer.innerHTML = `<h2 style="margin-top: 150px;">¡Tiempo agotado!</h2><p>Puntuación final: ${score}</p>`;
            startBtn.innerText = 'Jugar de nuevo';
            startBtn.style.display = 'inline-block';
        }
    </script>
</body>
</html>
