<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super PAE Recicla</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin: 4px 0;
      font-size: 1.1rem;
      color: #4CAF50;
    }
    #game-container {
      position: relative;
      width: min(96vw, 800px);
      height: auto;
      aspect-ratio: 2 / 1;
      max-height: 85vh;
      box-shadow: 0 0 25px rgba(0,255,0,0.25);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      background: #70c5ce;
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 10px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 2px 2px 4px #000;
      pointer-events: none;
    }
    .instructions {
      margin-top: 12px;
      font-size: 14px;
      color: #ccc;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Super PAE Recicla 🍎🥦📦</h1>
  
  <div id="game-container">
    <div class="hud">
      <div id="scoreDisplay">Puntos: 0</div>
      <div id="targetDisplay">Misión: Caneca Blanca (Plástico/Tetra)</div>
      <div id="livesDisplay">VIDAS: ❤️❤️❤️</div>
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div class="instructions">
    <b>Controles:</b> Flecha Izquierda / Derecha o A / D para moverte | Flecha Arriba, W o Espacio para Saltar.<br>
    <b>Regla:</b> ¡Recolecta solo los residuos que correspondan a la caneca activa para sumar puntos!
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Configuración general
    const GRAVITY = 0.5;
    let score = 0;
    let lives = 3;
    let gameActive = true;

    // Tipos de Canecas (Mecánica de selección)
    const BINS = [
      { type: 'organico', name: 'Caneca Verde (Orgánicos PAE)', color: '#2e7d32' },
      { type: 'reciclable', name: 'Caneca Blanca (Plástico/Tetra PAE)', color: '#ffffff' },
      { type: 'no_aprovechable', name: 'Caneca Negra (Servilletas/Sucios)', color: '#212121' }
    ];

    let currentBinIndex = 0;
    let currentTarget = BINS[currentBinIndex];

    // Jugador (Estilo Plataforma Mario)
    const player = {
      x: 50,
      y: 300,
      width: 32,
      height: 48,
      vx: 0,
      vy: 0,
      speed: 4.5,
      jumpForce: -11,
      grounded: false,
      color: '#ff5722'
    };

    // Teclas
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Plataformas del escenario
    const platforms = [
      { x: 0, y: 360, width: 800, height: 40 }, // Suelo principal
      { x: 150, y: 270, width: 140, height: 20 },
      { x: 350, y: 210, width: 120, height: 20 },
      { x: 550, y: 270, width: 140, height: 20 }
    ];

    // Residuos del PAE (Programa de Alimentación Escolar)
    const wasteItems = [
      { name: 'Cáscara de Banano', type: 'organico', icon: '🍌' },
      { name: 'Corazón de Manzana', type: 'organico', icon: '🍎' },
      { name: 'Bolsa de Leche', type: 'reciclable', icon: '🥛' },
      { name: 'Caja de Jugo', type: 'reciclable', icon: '🧃' },
      { name: 'Servilleta Usada', type: 'no_aprovechable', icon: '🧻' },
      { name: 'Empaque Plástico', type: 'reciclable', icon: '🍿' }
    ];

    let activeItems = [];

    function spawnItem() {
      if (activeItems.length >= 4) return;
      const randomItem = wasteItems[Math.floor(Math.random() * wasteItems.length)];
      const spawnX = 100 + Math.random() * 600;
      const spawnY = Math.random() < 0.5 ? 320 : (Math.random() < 0.5 ? 230 : 170);

      activeItems.push({
        ...randomItem,
        x: spawnX,
        y: spawnY,
        width: 28,
        height: 28
      });
    }

    setInterval(spawnItem, 2500);

    // Rotar la caneca objetivo periódicamente
    setInterval(() => {
      currentBinIndex = (currentBinIndex + 1) % BINS.length;
      currentTarget = BINS[currentBinIndex];
      document.getElementById('targetDisplay').innerText = `Misión: ${currentTarget.name}`;
    }, 10000);

    // Bucle Principal
    function update() {
      if (!gameActive) return;

      // Movimiento Lateral
      if (keys['ArrowRight'] || keys['KeyD']) player.vx = player.speed;
      else if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -player.speed;
      else player.vx = 0;

      // Salto
      if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) {
        player.vy = player.jumpForce;
        player.grounded = false;
      }

      // Aplicar Gravedad
      player.vy += GRAVITY;
      player.x += player.vx;
      player.y += player.vy;

      // Colisión con límites de pantalla
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      // Colisiones con Plataformas
      player.grounded = false;
      platforms.forEach(plat => {
        if (
          player.x < plat.x + plat.width &&
          player.x + player.width > plat.x &&
          player.y + player.height >= plat.y &&
          player.y + player.height <= plat.y + 12 &&
          player.vy >= 0
        ) {
          player.y = plat.y - player.height;
          player.vy = 0;
          player.grounded = true;
        }
      });

      // Recolección de Residuos
      activeItems = activeItems.filter(item => {
        if (
          player.x < item.x + item.width &&
          player.x + player.width > item.x &&
          player.y < item.y + item.height &&
          player.y + player.height > item.y
        ) {
          if (item.type === currentTarget.type) {
            score += 10;
          } else {
            lives--;
            if (lives <= 0) gameOver();
          }
          updateHUD();
          return false;
        }
        return true;
      });
    }

    function updateHUD() {
      document.getElementById('scoreDisplay').innerText = `Puntos: ${score}`;
      document.getElementById('livesDisplay').innerText = `VIDAS: ${'❤️'.repeat(Math.max(0, lives))}`;
    }

    function gameOver() {
      gameActive = false;
      setTimeout(() => {
        alert(`¡Juego Terminado!\n\nPuntaje final: ${score}\n¡Recuerda separar correctamente los residuos del PAE en tu colegio!`);
        document.location.reload();
      }, 100);
    }

    function draw() {
      // Limpiar pantalla (Cielo)
      ctx.fillStyle = '#70c5ce';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dibujar Plataformas (Estilo Bloque)
      platforms.forEach(plat => {
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(plat.x, plat.y, plat.width, 6); // Pasto superior
      });

      // Dibujar Indicador Visual de Caneca Activa en el Fondo
      ctx.save();
      ctx.fillStyle = currentTarget.color;
      ctx.globalAlpha = 0.25;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      // Dibujar Jugador
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);
      // Gorra estilo Mario
      ctx.fillStyle = '#d32f2f';
      ctx.fillRect(player.x - 2, player.y, player.width + 6, 10);

      // Dibujar Residuos
      ctx.font = '22px serif';
      activeItems.forEach(item => {
        ctx.fillText(item.icon, item.x, item.y + 22);
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
